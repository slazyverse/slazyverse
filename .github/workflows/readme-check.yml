name: README integrity

# The profile is treated as a production artifact: every asset it references
# must exist, every SVG must parse, and every link must resolve. Runs weekly as
# well, because linked repositories can move without this one changing.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Assets, structure and links
        run: python tools/check_readme.py
