<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="divider"><title>divider</title><style>.rg{transform-box:fill-box;transform-origin:center;animation:rg 3.2s ease-out infinite}.rg2{animation-delay:1.6s}@keyframes rg{0%{transform:scale(1);opacity:.8}70%{transform:scale(3.4);opacity:0}100%{transform:scale(3.4);opacity:0}}.ar{transform-box:fill-box;animation:ar 3.2s cubic-bezier(.16,1,.3,1) infinite}.arl{transform-origin:right center}.arr{transform-origin:left center}@keyframes ar{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:0}100%{transform:scaleX(1);opacity:0}}</style><defs><linearGradient id="fl" gradientUnits="userSpaceOnUse" x1="0" x2="1000" y1="0" y2="0"><stop offset="0" stop-color="#1f2328" stop-opacity="0"/><stop offset="0.14" stop-color="#1f2328" stop-opacity="0.16"/><stop offset="0.86" stop-color="#1f2328" stop-opacity="0.16"/><stop offset="1" stop-color="#1f2328" stop-opacity="0"/></linearGradient><linearGradient id="gl" x1="1" x2="0"><stop offset="0" stop-color="#0a7ea4"/><stop offset="1" stop-color="#0a7ea4" stop-opacity="0"/></linearGradient><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#0a7ea4"/><stop offset="1" stop-color="#0a7ea4" stop-opacity="0"/></linearGradient></defs><line x1="0" y1="12" x2="486" y2="12" stroke="url(#fl)"/><line x1="514" y1="12" x2="1000" y2="12" stroke="url(#fl)"/><rect class="ar arl" x="286" y="11.25" width="200" height="1.5" fill="url(#gl)"/><rect class="ar arr" x="514" y="11.25" width="200" height="1.5" fill="url(#gr)"/><circle class="rg" cx="500" cy="12" r="3" fill="none" stroke="#0a7ea4"/><circle class="rg rg2" cx="500" cy="12" r="3" fill="none" stroke="#0a7ea4"/><circle cx="500" cy="12" r="3" fill="#0a7ea4"/></svg>
